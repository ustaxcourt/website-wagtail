# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-json
    -   id: check-xml

- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.12.2
  hooks:
    # Run the linter.
    - id: ruff-check
    # Run the formatter.
    - id: ruff-format

- repo: local
  hooks:
    - id: django-migrations-check
      name: Check for missing Django migrations
      entry: bash -c 'source .venv/bin/activate && cd website && python manage.py makemigrations --check --dry-run --noinput || { echo "Missing migrations detected. Run '\''make makemigrations'\'' and stage the generated file." >&2; exit 1; }'
      language: system
      pass_filenames: false
      files: ^website/
      types: [python]

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']