version: 2

updates:
  # Python dependencies (website/requirements.txt -> requirements/base.txt, local.txt)
  - package-ecosystem: "pip"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"
      pip-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major version bumps for Django/Wagtail should be planned as their own
      # tracked work per docs/adr/0010-dependabots-setup.md, not auto-PR'd.
      - dependency-name: "Django"
        update-types: ["version-update:semver-major"]
      - dependency-name: "wagtail"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "python"
      - "opex"
    commit-message:
      prefix: "chore(deps)"

  # Frontend JS dependencies for the main website (USWDS/Gulp toolchain)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "javascript"
      - "opex"
    commit-message:
      prefix: "chore(deps)"

  # Load testing tooling dependencies
  - package-ecosystem: "npm"
    directory: "/loadtests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "javascript"
      - "opex"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "devops"
      - "opex"
    commit-message:
      prefix: "chore(deps)"
