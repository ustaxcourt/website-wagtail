name: Run all pull requests checks

on:
    push:
        branches:
          - main
    pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
        cd website
        set -e
        make setup

    - name: Check for missing migrations
      run: |
        cd website
        make check-migrations

    - name: Run pre-commit hooks
      run: pre-commit run --all-files

    - name: Run Unit Tests with Coverage
      run: |
        cd website
        . ../.venv/bin/activate
        coverage run -m pytest
        coverage report -m --fail-under=75 | tee coverage-report.txt

    - name: Add Coverage to Step Summary
      if: always() && hashFiles('website/coverage-report.txt') != ''
      run: |
        echo "## Test Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat website/coverage-report.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Post Coverage Comment
      if: always() && github.event_name == 'pull_request' && hashFiles('website/coverage-report.txt') != ''
      uses: MishaKav/pytest-coverage-comment@v1.7.2
      with:
        pytest-coverage-path: ./website/coverage-report.txt
        title: Test Coverage Report

    - name: Run Cypress Tests
      env:
        CYPRESS_ADMIN_USERNAME: ${{ secrets.CYPRESS_ADMIN_USERNAME || 'admin' }}
        CYPRESS_ADMIN_PASSWORD: ${{ secrets.CYPRESS_ADMIN_PASSWORD || 'ustcAdminPW!' }}
      run: |
        cd website
        make migrate
        make superuser
        make createpages
        make updatepages
        make run &
        echo "Waiting for application to be ready on port 8000..."
        for i in {1..30}; do
          if curl -s http://127.0.0.1:8000 > /dev/null; then
            echo "Application is ready!"
            sleep 2
            break
          fi
          echo "Waiting for port 8000... ($i/30)"
          sleep 2
        done
        if ! curl -s http://127.0.0.1:8000 > /dev/null; then
          echo "Application failed to start on port 8000 within the expected time." >&2
          exit 1
        fi
        make test-e2e
