name: Run all pull requests checks

on:
    push:
        branches:
          - main
    pull_request:
      types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      COVERAGE_MINIMUM: "75"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
        cd website
        set -e
        make setup

    - name: Check for missing migrations
      run: |
        cd website
        make check-migrations

    - name: Run pre-commit hooks
      run: pre-commit run --all-files

    - name: Run Unit Tests with Coverage
      run: |
        cd website
        . ../.venv/bin/activate
        coverage run -m pytest
        coverage report -m | tee coverage-report.txt
        coverage xml -o coverage.xml

    - name: Parse coverage metrics
      id: coverage_metrics
      if: always() && hashFiles('website/coverage-report.txt') != ''
      run: |
        COVERAGE_PERCENT=$(awk '/TOTAL/ {gsub("%", "", $NF); print $NF}' website/coverage-report.txt)
        echo "coverage_percent=$COVERAGE_PERCENT" >> "$GITHUB_OUTPUT"

    - name: Add Coverage to Step Summary
      if: always() && hashFiles('website/coverage-report.txt') != ''
      run: |
        COVERAGE_PERCENT='${{ steps.coverage_metrics.outputs.coverage_percent }}'
        COVERAGE_MINIMUM='${{ env.COVERAGE_MINIMUM }}'
        STATUS="PASS"
        if python -c "import os,sys; c=float(os.environ['COVERAGE_PERCENT']); m=float(os.environ['COVERAGE_MINIMUM']); sys.exit(0 if c < m else 1)"
        then
          STATUS="FAIL"
        fi

        echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Total Coverage | ${COVERAGE_PERCENT}% |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Minimum Required | ${COVERAGE_MINIMUM}% |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Status | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "<details><summary>Detailed coverage output</summary>" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat website/coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "</details>" >> "$GITHUB_STEP_SUMMARY"

    - name: Enforce minimum coverage
      if: always() && hashFiles('website/coverage-report.txt') != ''
      env:
        COVERAGE_PERCENT: ${{ steps.coverage_metrics.outputs.coverage_percent }}
      run: |
        python -c "import os,sys; c=float(os.environ['COVERAGE_PERCENT']); m=float(os.environ['COVERAGE_MINIMUM']); print(f'::error::Coverage gate failed: {c:.2f}% is below required minimum {m:.2f}%') if c < m else print(f'Coverage gate passed: {c:.2f}% >= {m:.2f}%'); sys.exit(1 if c < m else 0)"

    - name: Upload coverage artifacts
      if: always() && hashFiles('website/coverage-report.txt') != ''
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          website/coverage-report.txt
          website/coverage.xml

    - name: Post Coverage Comment
      if: always() && github.event_name == 'pull_request' && hashFiles('website/coverage-report.txt') != ''
      uses: MishaKav/pytest-coverage-comment@v1.7.2
      with:
        pytest-coverage-path: ./website/coverage-report.txt
        title: "Test Coverage Report (min: ${{ env.COVERAGE_MINIMUM }}%)"

    - name: Run Cypress Tests
      env:
        CYPRESS_ADMIN_USERNAME: ${{ secrets.CYPRESS_ADMIN_USERNAME || 'admin' }}
        CYPRESS_ADMIN_PASSWORD: ${{ secrets.CYPRESS_ADMIN_PASSWORD || 'ustcAdminPW!' }}
      run: |
        cd website
        make migrate
        make superuser
        make createpages
        make updatepages
        make run &
        echo "Waiting for application to be ready on port 8000..."
        for i in {1..30}; do
          if curl -s http://127.0.0.1:8000 > /dev/null; then
            echo "Application is ready!"
            sleep 2
            break
          fi
          echo "Waiting for port 8000... ($i/30)"
          sleep 2
        done
        if ! curl -s http://127.0.0.1:8000 > /dev/null; then
          echo "Application failed to start on port 8000 within the expected time." >&2
          exit 1
        fi
        make test-e2e
