name: Run all pull requests checks

on:
    push:
        branches:
          - main
    pull_request:
      types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      COVERAGE_MINIMUM: "75"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: ./.github/actions/setup-python

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit
        cd website
        set -e
        make setup

    - name: Check for missing migrations
      run: |
        cd website
        make check-migrations

    - name: Run pre-commit hooks
      run: pre-commit run --all-files

    - name: Run Unit Tests with Coverage
      run: |
        cd website
        . ../.venv/bin/activate
        set -o pipefail
        pytest --cov --cov-report=term-missing --cov-report=xml:coverage.xml | tee coverage-report.txt

    - name: Parse coverage metrics
      id: coverage_metrics
      if: always() && hashFiles('website/coverage-report.txt') != ''
      run: |
        COVERAGE_PERCENT=$(awk '/TOTAL/ {gsub("%", "", $NF); print $NF}' website/coverage-report.txt)
        echo "coverage_percent=$COVERAGE_PERCENT" >> "$GITHUB_OUTPUT"

    - name: Add Coverage to Step Summary
      if: always() && hashFiles('website/coverage-report.txt') != ''
      env:
        COVERAGE_PERCENT: ${{ steps.coverage_metrics.outputs.coverage_percent }}
      run: |
        if python -c "import os,sys; sys.exit(0 if float(os.environ['COVERAGE_PERCENT']) >= float(os.environ['COVERAGE_MINIMUM']) else 1)"; then
          STATUS="PASS"
        else
          STATUS="FAIL"
        fi

        echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
        echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Total Coverage | ${COVERAGE_PERCENT}% |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Minimum Required | ${COVERAGE_MINIMUM}% |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Status | ${STATUS} |" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "<details><summary>Detailed coverage output</summary>" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat website/coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        echo "</details>" >> "$GITHUB_STEP_SUMMARY"

    - name: Enforce minimum coverage
      if: always() && hashFiles('website/coverage-report.txt') != ''
      env:
        COVERAGE_PERCENT: ${{ steps.coverage_metrics.outputs.coverage_percent }}
      run: |
        python -c "import os,sys; c=float(os.environ['COVERAGE_PERCENT']); m=float(os.environ['COVERAGE_MINIMUM']); print(f'::error::Coverage gate failed: {c:.2f}% is below required minimum {m:.2f}%') if c < m else print(f'Coverage gate passed: {c:.2f}% >= {m:.2f}%'); sys.exit(1 if c < m else 0)"

    - name: Upload coverage artifacts
      if: always() && hashFiles('website/coverage-report.txt') != ''
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          website/coverage-report.txt
          website/coverage.xml

    - name: Post Coverage Comment
      if: always() && github.event_name == 'pull_request' && hashFiles('website/coverage-report.txt') != ''
      uses: MishaKav/pytest-coverage-comment@v1.7.2
      with:
        pytest-coverage-path: ./website/coverage-report.txt
        title: "Test Coverage Report (min: ${{ env.COVERAGE_MINIMUM }}%)"
