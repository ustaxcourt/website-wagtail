name: Destroy

on:
  push:
    tags:
      - '*-destroy'   # for sandbox-destroy, qa-destroy

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      - name: Determine Environment
        id: set_env
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          if [[ "$TAG" == "sandbox-destroy" ]]; then
            echo "ENVIRONMENT=sandbox" >> $GITHUB_ENV
          elif [[ "$TAG" == "qa-destroy" ]]; then
            echo "ENVIRONMENT=qa" >> $GITHUB_ENV
          else
            echo "Unknown destroy tag: $TAG or environment: Destroy only supports 'sandbox' and 'qa'."
            exit 1
          fi

      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          ref: ${{ env.ENVIRONMENT }}

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: Apply Terraform destructive plan
        env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd infra
          echo "Destroying environment: $ENVIRONMENT"
          echo "Y" | ./destroy.sh
