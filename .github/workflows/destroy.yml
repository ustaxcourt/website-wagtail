name: Destroy

on:
  push:
    tags:
      - 'sandbox-destroy'

# Shared with deploy.yml so a user's sandbox deploy and destroy can't overlap.
concurrency:
  group: sandbox-${{ github.actor }}

jobs:
  destroy:
    environment: ${{ github.ref == 'refs/tags/sandbox-destroy' && format('{0}_sandbox', github.actor) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set Environment
        id: set_env
        run: |
          if [[ "${{ github.ref }}" == refs/tags/sandbox-destroy ]]; then
            echo "ENVIRONMENT=sandbox" >> $GITHUB_ENV
          else
            echo "Debug: No matching condition found"
            exit 1
          fi

      # Check out the pushed commit, not the shared `sandbox` tag, which may
      # point at another user's most recent deploy.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: Apply Terraform destructive plan
        id: tf_outputs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cd infra
          echo "Y" | ./destroy.sh
