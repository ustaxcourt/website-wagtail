name: QA Migration Check

# Runs after every push to `qa` to detect Django migration conflicts
# (e.g. two branches that both added a migration with the same number/parent).
# Uses an in-memory SQLite DB — no AWS infrastructure needed.

on:
  push:
    branches:
      - qa

jobs:
  migration-check:
    runs-on: ubuntu-latest
    name: Detect migration conflicts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Install dependencies
        run: |
          cd website
          make setup

      - name: Run migrations against fresh SQLite DB
        run: |
          cd website
          . .venv/bin/activate
          DJANGO_SETTINGS_MODULE=app.settings.local python manage.py migrate --no-input 2>&1 | tee /tmp/migration_output.txt
          EXIT_CODE=${PIPESTATUS[0]}

          if grep -qi "conflicting migrations" /tmp/migration_output.txt; then
            echo "::error::Migration graph conflict detected — two branches introduced migrations with the same parent. Resolve by adding a merge migration (python manage.py makemigrations --merge)."
            exit 1
          fi

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Migration check failed. See output above."
            exit 1
          fi

          echo "Migration check passed."
