name: QA Environment Pipeline

on:
  push:
    branches:
      - qa
    tags:
      - qa-destroy

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # QA DEPLOY — Runs when pushing to the `qa` branch
  qa_deploy:
    if: startsWith(github.ref, 'refs/heads/qa')
    name: Deploy QA (Basic Checks)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Set QA Environment
        run: echo "ENVIRONMENT=qa" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build USWDS
        run: |
          cd website
          make setup

      - name: Generate Release Tag
        if: ${{ github.ref == 'refs/heads/main' }}
        id: current_date
        run: echo "DATE=$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_OUTPUT

  # QA DESTROY — Runs when pushing a `qa-destroy` tag

  qa_destroy:
    if: startsWith(github.ref, 'refs/tags/qa-destroy')
    name: Destroy QA Environment
    runs-on: ubuntu-latest

    steps:
      - name: Set QA Destroy Flag
        run: echo "DESTROY_QA=true" >> $GITHUB_ENV

      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Print Destroy Notice
        run: |
          echo "QA destroy tag detected.."
          echo "This is where Terraform destroy or cleanup steps will later go."
          echo "For TDD, this is only a stub."
