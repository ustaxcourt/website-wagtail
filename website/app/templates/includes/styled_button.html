{% load static %}
{% load wagtailcore_tags navigation_tags%}

<style>
  .usa-button.styled-button{
    display: flex;
    align-items: center;
    color: var(--color-white);
    padding: 10px 20px;

    width: fit-content;
    font-size: 16px;
  }

  .usa-button.styled-button .button-icon {
    background-color: var(--color-white);
    width: 24px;
    height: 24px;
  }

  .usa-button.styled-button.no-hover:hover {
    background-color: var(--color-primary);
    color: var(--color-white);
  }

</style>

<body>
  <button class="usa-button styled-button {%if not block.value.button_hover%}no-hover{% endif %}" type="button"
  {% for link_item in block.value.url %}
    {%if link_item.block_type == 'external_url'%}
    onclick="window.location.href='{{ link_item.value }}'"
    {%else %}
      onclick="window.location.href='{% pageurl link_item.value %}'"
    {% endif %}
  {% endfor %}>

    {% if block.value.icon and block.value.icon.url %}
      <img class="button-icon" src="{{ block.value.icon.url }}" alt="Button icon">
    {% endif %}
    {{ block.value.text }}
  </button>
</body>
