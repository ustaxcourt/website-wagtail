{% load static %}
{% load wagtailcore_tags navigation_tags%}

<style>
  .usa-button.styled-button{
    display: flex;
    align-items: center;
    color: var(--color-white);
    padding: 10px 20px;

    width: fit-content;
    font-size: 16px;
  }

  .usa-button.styled-button .button-icon {
    background-color: var(--color-white);
    width: 24px;
    height: 24px;
  }

  .usa-button.styled-button.no-hover:hover {
    background-color: var(--color-primary);
    color: var(--color-white);
  }

</style>

<body>
  <button class="usa-button styled-button {%if not block.value.button_hover%}no-hover{% endif %}" type="button"
  {%if block.value.link.external%}
  onclick="window.location.href='{{ block.value.link.value.external_url }}'"
  {%elif block.value.link %}
     onclick="window.location.href='{{ block.value.link.internal_page.url }}'"
     {%else%}
      onclick="window.location.href='https://google.com'"
{% endif %}>

    {% if block.value.icon and block.value.icon.url %}
      <img class="button-icon" src="{{ block.value.icon.url }}" alt="Button icon">
    {% endif %}
    {{ block.value.text }}
  </button>
</body>
