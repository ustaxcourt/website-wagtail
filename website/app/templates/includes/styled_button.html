{% load static %}
{% load wagtailcore_tags navigation_tags custom_tags %}

<style>
  .usa-button.styled-button{
    display: flex;
    align-items: center;
    color: var(--color-white);
    padding: 10px 20px;

    min-height: 44px;
    width: fit-content;
    word-break: break-word;
    font-size: 16px;
    font-weight: bold;
    line-height: 1.025em;
  }

  .usa-button.styled-button .button-icon {
    background-color: var(--color-white);
    width: 24px;
    height: 24px;
  }

  .usa-button.styled-button.no-hover:hover {
    background-color: var(--color-primary);
    color: var(--color-white);
  }

</style>

<body>
  {% for link_item in block.value.url %}
      <span>{{ link_item.block_type }}</span>
      <span>{{ link_item|get_alt_attribute_from_url }}</span>
  <a class="usa-button styled-button {%if not block.value.button_hover%}no-hover{% endif %}" type="button"
          data-is-link="true"
    {% if link_item.block_type == 'external_url' %}
       href="{{ link_item.value }}"
    {% elif link_item.block_type == 'internal_url' %}
       href="{% pageurl link_item.value %}"
    {% elif link_item.block_type == 'internal_pdf' %}
       href="{{ link_item.value.url }}"
    {% endif %}
  {% endfor %}>

    {% if block.value.icon and block.value.icon.url %}
      <img class="button-icon" src="{{ block.value.icon.url }}" >
    {% endif %}
    {{ block.value.text }}
  </a>
</body>
