
{% load static %}
{% load wagtailcore_tags %}
<style>

  .accordian-block {
    background-color: var();
    border: 1px solid var(--color-border);
    border-radius: 4px;
    margin-bottom: 1rem;
  }
  .accordian-title {
    color: var(--color-primary);
    cursor: pointer;
    margin: 0;
    padding: 1rem;
    font-size: 1.2rem;
  }
  .accordian-title.active {
    color: #ffffff;
  }
  .accordian-icon {
    width: 15px;
    height: 15px;
    cursor: pointer;
    margin-right: 1.5rem;

    background-color: var(--color-primary);

    -webkit-mask-image: url({% static 'images/icons/arrow-down-triangle.svg' %});
    mask-image: url({% static 'images/icons/arrow-down-triangle.svg' %});

    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-size: contain;
    mask-size: contain;
  }
  .accordian-icon.active {
      background-color: var(--color-white);
  }

  .accordian-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 55px;
    background-color: var(--color-white);
    border-bottom: 1px solid var(--theme-color-base-lighter);
  }
  .accordian-header.active {
    background-color: var(--color-primary);
    border-bottom: none;
  }

  .accordian-header:hover {
    cursor: pointer;
  }
  .accordian-header p {
    color: var(--color-primary);
  }
  .hidden {
    display: none;
  }
  .accordian-content {
    padding: 20px 45px;
    width: 100%;
    border-bottom: 1px solid var(--theme-color-base-lighter);
  }
  .rotated {
    transform: rotate(180deg);
    transition: transform 0.3s ease;
  }

  @media (max-width: 768px) {
    .accordian-header {
      width: 100%;
      height: auto;
      padding: 10px;
    }
    .accordian-header h3 {
      font-size: 18px;
    }
    .accordian-content {
      width: 100%;
      padding: 20px 20px;
    }
  }



</style>

<body>
    <div id="accordian-{{block_index}}" class="accordian-block">
      <div class="accordian-header">
        <h3 class="accordian-title">{{ block.value.title }}</h3>
        <div class="accordian-icon"></div>
      </div>
        <div class="accordian-content hidden">
          {% for block in block.value.description %}
            {% if block.block_type == 'prose' %}
            <div class="rich-text">
                {{ block.value }}
            </div>

          {% elif block.block_type == 'callout' %}
              <div class="callout-content">
                  {% include_block block %}
              </div>

          {% endif %}
            <p>{{ block.value.description }}</p>
            {% endfor %}
        </div>
    </div>
</body>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const accordianBlock = document.getElementById("accordian-"+{{block_index}});
    const header = accordianBlock.querySelector(".accordian-header");
    const title = accordianBlock.querySelector(".accordian-title");
    const content = accordianBlock.querySelector(".accordian-content");
    const icon = accordianBlock.querySelector(".accordian-icon");

    header.addEventListener("click", function() {
      // check if content is visible
      content.classList.toggle("hidden");
      icon.classList.toggle("rotated");

      title.classList.toggle("active");
      header.classList.toggle("active");
      icon.classList.toggle("active");
    });
  });
  </script>
