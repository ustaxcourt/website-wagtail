{% load wagtailcore_tags %}
<div class="detailed-timeline-warning" role="note">
    <span class="detailed-timeline-warning-icon" aria-hidden="true"></span>
    <div class="detailed-timeline-warning-content">
        <span class="detailed-timeline-warning-sr-label">Warning</span>
        <h{{ heading_level|default:"3" }} class="detailed-timeline-warning-heading">{{ warning.heading }}</h{{ heading_level|default:"3" }}>
        {{ warning.text|richtext }}
    </div>
</div>
