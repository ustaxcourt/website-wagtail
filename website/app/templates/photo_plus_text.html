{% load wagtailcore_tags wagtailimages_tags %}
<div class="dedication dedication-{{ block.value.image_position|default:'left' }}">
    {% if block.value.title %}
        <h2 class="dedication-title">{{ block.value.title }}</h2>
    {% endif %}
    {% if block.value.photo %}
        <div class="dedication-image">
            {% image block.value.photo width-600 as photo_rendition %}
            <img src="{{ photo_rendition.url }}" width="{{ photo_rendition.width }}" height="{{ photo_rendition.height }}" alt="{{ block.value.alt_text }}" tabindex="0" role="img">
        </div>
    {% endif %}
    <div class="dedication-text">
        {{ block.value.paragraph_text|richtext }}
    </div>
</div>
