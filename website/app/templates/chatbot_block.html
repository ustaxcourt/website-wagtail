{% load static %}
<div class="chatbot-widget" id="chatbot-widget-{{ block_index }}">
  <h2 class="chatbot-widget__title">{{ block.value.title }}</h2>

  <div class="chatbot-widget__messages" id="chatbot-messages-{{ block_index }}" aria-live="polite" aria-label="Chat responses"></div>

  <form class="chatbot-widget__form" id="chatbot-form-{{ block_index }}" novalidate>
    {% csrf_token %}
    <label class="usa-label" for="chatbot-input-{{ block_index }}">Your question</label>
    <textarea
      class="usa-textarea chatbot-widget__input"
      id="chatbot-input-{{ block_index }}"
      name="message"
      rows="3"
      maxlength="1000"
      placeholder="{{ block.value.placeholder }}"
      aria-required="true"
    ></textarea>
    <button
      type="submit"
      class="usa-button chatbot-widget__submit"
      id="chatbot-submit-{{ block_index }}"
    >
      Ask
    </button>
  </form>

  <p class="chatbot-widget__disclaimer">
    Responses are generated by AI and may not be fully accurate.
    Always verify important information at
    <a href="https://ustaxcourt.gov">ustaxcourt.gov</a>.
  </p>
</div>

<style>
  .chatbot-widget {
    border: 1px solid #dfe1e2;
    border-radius: 4px;
    padding: 1.5rem;
    margin: 1rem 0;
    background-color: #f9f9f9;
    max-width: 700px;
  }

  .chatbot-widget__title {
    margin-top: 0;
    margin-bottom: 1rem;
    font-size: 1.25rem;
  }

  .chatbot-widget__messages {
    min-height: 60px;
    margin-bottom: 1rem;
  }

  .chatbot-widget__message {
    padding: 0.75rem 1rem;
    border-radius: 4px;
    margin-bottom: 0.75rem;
    line-height: 1.6;
  }

  .chatbot-widget__message--user {
    background-color: #e8f0fa;
    border-left: 4px solid #005ea2;
  }

  .chatbot-widget__message--assistant {
    background-color: #ffffff;
    border: 1px solid #dfe1e2;
  }

  .chatbot-widget__message--error {
    background-color: #fff3cd;
    border-left: 4px solid #e5a000;
  }

  .chatbot-widget__message--loading {
    color: #71767a;
    font-style: italic;
  }

  .chatbot-widget__input {
    width: 100%;
    margin-bottom: 0.75rem;
  }

  .chatbot-widget__submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .chatbot-widget__disclaimer {
    font-size: 0.85rem;
    color: #71767a;
    margin-top: 1rem;
    margin-bottom: 0;
  }
</style>

<script>
  (function () {
    const widgetIndex = "{{ block_index }}";
    const form = document.getElementById("chatbot-form-" + widgetIndex);
    const input = document.getElementById("chatbot-input-" + widgetIndex);
    const submitBtn = document.getElementById("chatbot-submit-" + widgetIndex);
    const messagesEl = document.getElementById("chatbot-messages-" + widgetIndex);

    function getCsrfToken() {
      const cookie = document.cookie.split(";").find((c) => c.trim().startsWith("csrftoken="));
      return cookie ? cookie.trim().split("=")[1] : "";
    }

    function appendMessage(text, type) {
      const div = document.createElement("div");
      div.className = "chatbot-widget__message chatbot-widget__message--" + type;
      div.textContent = text;
      messagesEl.appendChild(div);
      div.scrollIntoView({ behavior: "smooth", block: "nearest" });
      return div;
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      appendMessage(message, "user");
      input.value = "";
      submitBtn.disabled = true;
      const loadingEl = appendMessage("Thinking…", "loading");

      try {
        const res = await fetch("/chatbot/ask/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCsrfToken(),
          },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        loadingEl.remove();
        if (data.response) {
          appendMessage(data.response, "assistant");
        } else {
          appendMessage(data.error || "Something went wrong. Please try again.", "error");
        }
      } catch {
        loadingEl.remove();
        appendMessage("Could not reach the server. Please check your connection.", "error");
      } finally {
        submitBtn.disabled = false;
        input.focus();
      }
    });
  })();
</script>
