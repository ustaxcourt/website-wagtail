{% load static %}
<style>
    #red-news-banner-container {
        background-color: #B50909;
        width: 100%;
    }

    #red-news-banner-container .red-news-banner {
        color: #FFFFFF;
        font-family: 'Source Sans Pro', sans-serif;
        font-size: 20px;
        font-weight: 400;
        display: none;
        /* Hidden by default, shown by JavaScript if within date range */
    }

    #red-news-banner-container .red-news-banner p {
        margin: 0;
        padding: 0;
        line-height: 1.5;
        color: #FFFFFF;
    }

    #red-news-banner-container .red-news-banner a {
        color: #FFFFFF;
        text-decoration: underline;
        font-weight: 400;
    }

    #red-news-banner-container .red-news-banner a:hover {
        color: #EEEEEE;
    }

    #red-news-banner-container .red-news-banner .alert-content {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 0;
    }

    #red-news-banner-container .red-news-banner .alert-icon {
        flex-shrink: 0;
        width: 24px;
        height: 24px;
    }

    #red-news-banner-container .red-news-banner .alert-text {
        flex: 1;
    }

    #red-news-banner-container .red-news-banner .alert-text p {
        display: inline;
    }

    #red-news-banner-container .red-news-banner .alert-text strong {
        display: inline;
    }
</style>
{% if has_critical_news %}
    <!-- Embed critical news data as JSON for client-side processing -->
    <script id="critical-news-data" type="application/json">
{{ critical_priority_news_json | safe }}
    </script>
    <div id="red-news-banner-container"></div>
    <script type="text/javascript">
        (function() {
            // Parse the news data from the JSON script tag
            const newsDataElement = document.getElementById('critical-news-data');
            if (!newsDataElement) return;

            let newsItems;
            try {
                newsItems = JSON.parse(newsDataElement.textContent);
            } catch (e) {
                console.error('Failed to parse critical news data:', e);
                return;
            }

            // Get current date/time in user's local timezone
            const now = new Date();

            // Filter news items based on start/end dates
            const activeNewsItems = newsItems.filter(function(item) {
                // If no dates are set, show the item
                if (!item.banner_start_date && !item.banner_end_date) {
                    return true;
                }

                // Parse ISO dates - these will be converted to user's local timezone automatically
                const startDate = item.banner_start_date ? new Date(item.banner_start_date) : null;
                const endDate = item.banner_end_date ? new Date(item.banner_end_date) : null;

                // Check if current time is within the date range
                const afterStart = !startDate || now >= startDate;
                const beforeEnd = !endDate || now <= endDate;

                return afterStart && beforeEnd;
            });

            // If no active items, don't render anything
            if (activeNewsItems.length === 0) return;

            // Only show the most recent one (they're already ordered by publish_date DESC)
            const itemToShow = activeNewsItems[0];

            // Create banner HTML (no close button for critical banners)
            const container = document.getElementById('red-news-banner-container');
            const bannerId = 'redNewsBanner-' + itemToShow.id;

            // Build the document link if available
            const documentLink = itemToShow.document_url
                ? ` <a href="${itemToShow.document_url}">See the Press Release</a>.`
                : '';

            const bannerHTML = `
            <div class="red-news-banner" id="${bannerId}">
                <div class="grid-container">
                    <div class="alert-content">
                        <svg class="alert-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <div class="alert-text">
                            <strong>Important Notice:</strong> ${itemToShow.description}${documentLink}
                        </div>
                    </div>
                </div>
            </div>
        `;

            container.innerHTML = bannerHTML;

            // Always show the banner (no dismissal for critical banners)
            document.getElementById(bannerId).style.display = 'block';
        })();
    </script>
{% endif %}
