{% load wagtailcore_tags %}
{% load filters %}
{% comment %} {% load static %} {% endcomment %}
<style>
.filter-link {
    padding: 0.5rem 1rem;
    border: 1px solid #dcdee0;
    background-color: #fff;
    color: #000;
    font-size: 1rem;
    cursor: pointer;
    border-radius: 4px;
    transition: background-color 0.2s ease, border-color 0.2s ease;
    text-decoration: none;
    font-weight: 400;
}
.filter-link:hover {
    border-color: #007BFF;
}

.filter-menu-desktop {
    display: flex;
    flex-wrap: wrap;
    gap: 1.9rem;
}

.filter-mobile {
    display: none;
    position: relative;
}
.filter-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #162E51;
    background-color: #fff;
    color: #162E51;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
    transition: background-color 0.2s ease, color 0.2s ease;
}
.filter-toggle:hover {
    background-color: #1A4480;
    color: #FFFFFF;
    border-color: #FFFFFF;
}
.filter-toggle.active {
    background-color: #162E51;
    color: #FFFFFF;
    border-color: #FFFFFF;
}
.filter-toggle.active > .toggle-icon > img,
.filter-toggle:hover > .toggle-icon > img {
    filter: brightness(0) invert(1);
}
.filter-menu-mobile {
    display: none;
    flex-direction: column;
    gap: 16px;
    margin-top: 4px;
    padding: 24px 16px 16px;
    background-color: #FFFFFF;
    border-radius: 4px;
    box-shadow: 0px 4px 4px 0px rgba(0, 0, 0, 0.25);
}
.filter-menu-mobile.open {
    display: flex;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    width: 288px;
    max-width: calc(100vw - 32px);
    z-index: 100;
}
.filter-menu-mobile-heading {
    font-size: 1rem;
    font-weight: 600;
    color: #000;
}
.filter-menu-mobile-letters {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
}
.filter-mobile .filter-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    padding: 0;
    border: 1px solid #A9AEB1;
    border-radius: 50%;
    background-color: #FFFFFF;
    color: #005EA2;
    font-size: 1rem;
}
.filter-mobile .filter-link:hover {
    border-color: #005EA2;
}

@media (max-width: 768px) {
    .filter-mobile {
        display: block;
    }
}
</style>
{% load static %}

<div class="filter-mobile">
    <button class="filter-toggle" aria-expanded="false" aria-controls="filter-nav-mobile" aria-label="Filter Items">
        <span>Filter Items</span>
        <span class="toggle-icon" aria-hidden="true">
            <img src="{% static 'images/icons/filter_icon.svg' %}" alt="" width="20" height="20">
        </span>
    </button>
    <div class="filter-menu-mobile" id="filter-nav-mobile">
        <div class="filter-menu-mobile-heading">Jump to letter</div>
        <div class="filter-menu-mobile-letters">
            {% for item in letters %}
                <a href="#{{ item }}" class="filter-link">{{ item }}</a>
            {% endfor %}
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const filterToggle = document.querySelector('.filter-toggle');
        const filterMenuMobile = document.getElementById('filter-nav-mobile');

        if (filterToggle && filterMenuMobile) {
            // Toggle menu open/close
            filterToggle.addEventListener('click', function () {
                const isOpen = filterMenuMobile.classList.toggle('open');
                filterToggle.classList.toggle('active', isOpen);
                filterToggle.setAttribute('aria-expanded', isOpen);
            });

            // Close the dropdown after clicking a filter link
            filterMenuMobile.querySelectorAll('.filter-link').forEach(function (link) {
                link.addEventListener('click', function () {
                    filterMenuMobile.classList.remove('open');
                    filterToggle.classList.remove('active');
                    filterToggle.setAttribute('aria-expanded', 'false');
                });
            });
        }
    });
</script>
