{% extends "wagtailadmin/base.html" %}
{% load static env_tags %}
{% block extra_css %}
    {{ block.super }}
    <style>
        .pagination {
            margin-bottom: 3rem;
        }

        .admin-env-banner,
        .moderation-notification-bar {
            background-color: #FAA500;
            color: #020103;
            padding: 10px 15px;
            font-weight: bold;
            text-align: center;
            font-size: 15px;
            border-bottom: 1px solid #ffeeba;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inline-panel-no-add-button #id_entries-ADD {
            display: none !important;
        }
    </style>
{% endblock %}
{% block extra_js %}
    {{ block.super }}
    {% get_environment as current_env %}
    <script>
        const ENVIRONMENT = "{{ current_env }}";

        document.addEventListener("DOMContentLoaded", function() {
            // Create the button
            const scrollButton = document.createElement("button");
            scrollButton.innerText = "Scroll to Bottom";
            scrollButton.style.position = "fixed";
            scrollButton.style.bottom = "15px";
            scrollButton.style.right = "20px";
            scrollButton.style.padding = "10px 15px";
            scrollButton.style.background = "#007acc";
            scrollButton.style.color = "white";
            scrollButton.style.border = "none";
            scrollButton.style.borderRadius = "5px";
            scrollButton.style.cursor = "pointer";
            scrollButton.style.zIndex = "1000";
            scrollButton.style.boxShadow = "0 2px 5px rgba(0,0,0,0.3)";

            // Scroll to bottom when clicked
            scrollButton.addEventListener("click", function() {
                const wrapper = document.getElementById("main");
                const pageHeight = wrapper.scrollHeight;
                wrapper.scrollTo({
                    top: pageHeight,
                    behavior: "smooth"
                });
            });

            // Add the button to the admin dashboard
            document.body.appendChild(scrollButton);

            // Banner only in non-production
            if (ENVIRONMENT !== "production") {
                const environment_banner = document.createElement("div");
                environment_banner.className = "admin-env-banner";
                environment_banner.innerHTML = `
                    <span> ⚠️ You are in the ${ENVIRONMENT.toUpperCase()} environment.</span>
                `;
                const header = document.querySelector("main");
                if (header && header.parentNode) {
                    header.parentNode.insertBefore(environment_banner, header);
                }
            }
        });
    </script>
{% endblock %}
