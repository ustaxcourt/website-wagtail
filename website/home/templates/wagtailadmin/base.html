{% extends "wagtailadmin/base.html" %}
{% block extra_css %}
    {{ block.super }}
    <style>
        .pagination {
            margin-bottom: 3rem;
        }
        .admin-env-banner {
            background-color: #FAA500;
            color: #020103;
            padding: 10px 15px;
            font-weight: bold;
            text-align: center;
            font-size: 15px;
            border-bottom: 1px solid #ffeeba;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
{% endblock %}

{% block body_class %}
    {{ block.super }}
    {% if environment != "production" %}
    {% endif %}
{% endblock %}

{% block extra_js %}
    {{ block.super }}
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Create the button
            var scrollButton = document.createElement("button");
            scrollButton.innerText = "Scroll to Bottom";
            scrollButton.style.position = "fixed";
            scrollButton.style.bottom = "15px";
            scrollButton.style.right = "20px";
            scrollButton.style.padding = "10px 15px";
            scrollButton.style.background = "#007acc";
            scrollButton.style.color = "white";
            scrollButton.style.border = "none";
            scrollButton.style.borderRadius = "5px";
            scrollButton.style.cursor = "pointer";
            scrollButton.style.zIndex = "1000";
            scrollButton.style.boxShadow = "0 2px 5px rgba(0,0,0,0.3)";

            // Scroll to bottom when clicked
            scrollButton.addEventListener("click", function() {
                const wrapper = document.getElementById("main");
                const pageHeight = wrapper.scrollHeight;
                wrapper.scrollTo({
                    top: pageHeight,
                    behavior: "smooth"
                });
            });

            // Add the button to the admin dashboard
            document.body.appendChild(scrollButton);

            {% if environment != "production" %}
            const banner = document.createElement("div");
            banner.className = "admin-env-banner";
            banner.innerHTML = `
                    <span> ⚠️ You are in the {{ environment|upper }} environment — changes here will not affect production.</span>
                `;
            const header = document.querySelector(".wagtail-logo") || document.querySelector("header");
            if (header && header.parentNode) {
                header.parentNode.insertBefore(banner, header.nextSibling);
            }
            {% endif %}
        });
    </script>
{% endblock %}
